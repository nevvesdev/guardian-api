version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres
    environment:
      POSTGRES_DB: guardian_db
      POSTGRES_USER: guardian_user
      POSTGRES_PASSWORD: guardian_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - guardian-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: guardian-redis
    ports:
      - "6379:6379"
    networks:
      - guardian-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  guardian-network:
    driver: bridge