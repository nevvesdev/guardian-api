spring:
  application:
    name: guardian-api

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  datasource:
    url: jdbc:postgresql://localhost:5432/guardian_db
    username: guardian_user
    password: guardian_pass
    driver-class-name: org.postgresql.Driver

  redis:
    host: localhost
    port: 6379
    timeout: 60000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

server:
 servlet:
    context-path: /api
    port: 8080

logging:
  level:
    root: INFO
    com.nevvesdev.guardianapi: DEBUG

jwt:
  secret: your-super-secret-key-that-is-at-least-32-characters-long-for-hs256-change-in-production
  expiration: 86400000
  refresh-expiration: 604800000