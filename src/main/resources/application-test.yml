spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/guardian_db
    username: guardian_user
    password: guardian_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  redis:
    host: localhost
    port: 6379

jwt:
  secret: your-super-secret-key-that-is-at-least-32-characters-long-for-hs256-change-in-production
  expiration: 86400000
  refresh-expiration: 604800000

rate-limit:
  max-requests: 1000
  window-seconds: 60

logging:
  level:
    root: WARN
    com.nevvesdev.guardianapi: DEBUG